name: CI

# The gate definitions live in ninoverse/.github so every Node repository in the
# organization runs the same ones. This file only says *when* to run them, and
# what this repository's Node floor is.
#
# The reusable workflow's contract is the package.json scripts: it runs
# `pnpm lint`, `pnpm typecheck`, `pnpm test` and `pnpm build`, so the command
# behind each gate keeps exactly one definition, in package.json.

on:
  push:
    branches: [main]
  pull_request:

# Belongs here rather than in the called workflow: inside a called workflow,
# `github.workflow` still resolves to this caller's name.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Pinned to a released version, not @main or a short @v1: @main lands here
    # with no pull request, and @v1 never moves. Renovate opens the bump.
    uses: ninoverse/.github/.github/workflows/node-ci.yml@v1.11.1
    with:
      # The lower bound of engines.node in package.json, as an exact version.
      # With no `imports`, the floor job installs the app on it with
      # engine-strict and builds it there, as the app's own runtime would.
      node-floor: "22.12.0"
      # The tests run in Vitest's browser mode, in Playwright's Chromium.
      playwright: chromium

  # actionlint over the files in this directory, with ShellCheck on their
  # `run:` blocks. Its check reads `workflows / actionlint`. Pinned like `ci`.
  workflows:
    uses: ninoverse/.github/.github/workflows/actionlint.yml@v1.11.1

  # The composed agent rules are what .agentprofile.yml composes: a profile
  # change without `pnpm agentcfg sync`, or a hand edit between the agentcfg
  # markers, fails here. The script fetches a static binary, so nothing is
  # installed.
  agentcfg:
    name: agentcfg check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/agentcfg.sh check
